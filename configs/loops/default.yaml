training:
  epochs: 30
  max_grad_norm: 1.0

  dataloader:
    batch_size: 512
    num_workers: 0         # the dataset is in-memory tensors; worker processes also segfault on macOS
    shuffle: true
    pin_memory: false

  early_stopping:
    patience: 5
    min_delta: 0.001

validation:
  dataloader:
    batch_size: 512
    num_workers: 0
    shuffle: false
    pin_memory: false
