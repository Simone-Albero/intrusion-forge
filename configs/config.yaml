defaults:
  - data: cic_2018_v2
  - classifier: mlp
  - space: default
  - graph: default
  - clustering: kmeans
  - loss: focal             # consumed only by DL classifiers
  - optimizer: adamw        # consumed only by DL classifiers
  - scheduler: one_cycle    # consumed only by DL classifiers
  - fit: default            # how the classifier is trained: balancing, epochs, early stopping
  - complexity: default
  - failure_regressor: default
  - grid_search: default
  - _self_
  - path: default

seed: 42
name: exp_euc
distance: euclidean                  # euclidean | cosine — metric of the graph, the regions and the complexity measures
force: false                         # recompute every cached stage: split, graph, regions, complexity and classify's model
figure_format: pdf                   # figure file format: pdf (vector, lighter) | png

hydra:
  run:
    dir: .
  output_subdir: null
  job:
    chdir: False
