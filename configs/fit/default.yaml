balance: undersample     # training-split class balancing: undersample | none
n_samples: null          # when set, caps every class of the training split at n_samples // n_classes
kfold: true              # true: k-fold out-of-fold over train+test; false: one model evaluated on test
kfold_splits: 5          # folds when kfold=true, capped by the rarest class
device: cpu              # DL classifiers only

training:                # DL classifiers only
  epochs: 30
  max_grad_norm: 1.0

  dataloader:
    batch_size: 512
    num_workers: 0         # the dataset is in-memory tensors; worker processes also segfault on macOS
    shuffle: true
    pin_memory: false

  early_stopping:
    patience: 5
    min_delta: 0.001

validation:              # DL classifiers only
  dataloader:
    batch_size: 512
    num_workers: 0
    shuffle: false
    pin_memory: false
