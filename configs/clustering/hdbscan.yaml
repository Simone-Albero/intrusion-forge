max_fit_samples: 20000
max_regions: 2500                  # regions over all classes, shared equally between them
min_cluster_floor: 20              # merge floor for undersized clusters and noise, scaled by the scored sample fraction while sweeping
hardness_k: 30                     # neighbours behind the kDN hardness a candidate's reliability is judged on
reliability_target: 0.9            # a coarser partition needs this predicted reliability to beat a finer one; below it, every candidate is scored and the highest wins
algorithms:
  hdbscan:
    min_cluster_size: [5, 10, 25, 50, 100, 200]   # small floor so small classes can form genuine clusters instead of collapsing to all-noise
    min_samples: [1, 5, 15, 50, 100]              # capped low: high min_samples inflates core distances and manufactures noise
    cluster_selection_method: leaf                # leaf over eom: extracts finer, more numerous clusters
    # Noise merges into the nearest surviving region, like any undersized cluster.
