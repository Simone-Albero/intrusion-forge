distance: ${distance}              # inherited from the top-level key
max_fit_samples: 20000
min_cluster_floor: 20              # cap on the size below which a cluster turns to noise; keep ≥ complexity.min_subsample_per_cluster
min_clusters: 5                    # not applied to hdbscan: a count guard would admit tiny clusters the noise floor then removes
grid_target_cluster_size: 50       # hdbscan has no n_clusters to derive: this only sets the noise floor
resolution_weight: 0.5             # score tilt w·k/k_max: a coarser partition must beat the finest by w·(1−k/k_max); higher → more clusters
algorithms:
  hdbscan:
    min_cluster_size: [5, 10, 25, 50, 100, 200]   # small floor so small classes can form genuine clusters instead of collapsing to all-noise; the resolution tilt favours the smaller end (more clusters) where noise stays low
    min_samples: [1, 5, 15, 50, 100]              # capped low: high min_samples inflates core distances and manufactures noise
    cluster_selection_method: leaf                # leaf over eom: extracts finer, more numerous clusters
    # Noise points become per-class pseudo-clusters, excluded from the complexity graph
    # and the failure regressor.
