distance: ${distance}              # inherited from the top-level key
max_fit_samples: 20000
min_cluster_floor: 20              # cap on the size below which a cluster turns to noise; keep ≥ complexity.min_subsample_per_cluster
min_clusters: 5                    # fewest clusters per class the selected partition may have before the noise floor, when any candidate reaches it
grid_target_cluster_size: 50       # finest n_clusters candidate ≈ class size / this, halved per coarser step, within the per-class cluster budget; also sets the noise floor
resolution_weight: 0.5             # score tilt w·k/k_max: a coarser partition must beat the finest by w·(1−k/k_max); higher → more clusters
algorithms:
  birch:                             # n_clusters derived per class
    branching_factor: 50
