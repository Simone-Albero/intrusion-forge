max_fit_samples: 20000
max_regions: 2500                  # regions over all classes, shared equally between them
min_cluster_floor: 20              # finest n_clusters candidate ≈ class size / this; also the merge floor for undersized clusters and noise, scaled by the scored sample fraction while sweeping
hardness_k: 30                     # neighbours behind the kDN hardness a candidate's loss is judged on
algorithms:
  birch:                             # n_clusters derived per class
    branching_factor: 50
